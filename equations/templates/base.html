<!DOCTYPE html>
<html>
    <head>
        <title>Thinker Games</title>
        <link rel="stylesheet" type="text/css" href="/static/css/style.css">
    </head>
    <body>
        <h1><a href="/">Thinker Games</a></h1>
        <!-- <script async src="/game.bundle.js"></script> -->

            {% if messages %}
                {% for message in messages %}
                    <p class='flashed'>{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}

        <footer><p><a href="/privacy/">Privacy Policy</a></p></footer>

    </body>
</html>
